name: Quantum Bot Research

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 0"

jobs:

  research:

    runs-on: ubuntu-latest

    steps:

      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install "freqtrade[hyperopt]"

          python -c "import filelock; print('filelock OK')"

          freqtrade --version

      - name: Create directories
        run: |

          mkdir -p data

          mkdir -p user_data/strategies

          mkdir -p user_data/configs

          mkdir -p user_data/data

          mkdir -p data/backtests

          cp QuantumMomentumStrategy.py \
             user_data/strategies/

          cp config.json \
             user_data/configs/

      - name: Scan
        run: |

          python scanner.py

      - name: Download futures data
        run: |

          freqtrade download-data \
            --config config.json \
            --trading-mode futures \
            --timeframes 15m \
            --days 130 \
            --new-pairs-days 130

      - name: Optimize
        run: |

          python optimizer.py \
            --timerange "$(python - <<'PY'
          from datetime import datetime, timedelta, timezone

          end = datetime.now(timezone.utc).date()

          start = end - timedelta(days=90)

          print(
              start.strftime("%Y%m%d")
              + "-"
              + end.strftime("%Y%m%d")
          )
          PY
          )"

      - name: Walk Forward Test
        run: |

          python walk_forward.py

      - name: Lookahead check
        run: |

          freqtrade lookahead-analysis \
            --config config.json \
            --strategy QuantumMomentumStrategy \
            --timerange "$(python - <<'PY'
          from datetime import datetime, timedelta, timezone

          end = datetime.now(timezone.utc).date()

          start = end - timedelta(days=30)

          print(
              start.strftime("%Y%m%d")
              + "-"
              + end.strftime("%Y%m%d")
          )
          PY
          )" \
            --pairs BTC/USDT:USDT \
            --minimum-trade-amount 10 || true

      - name: Save results
        run: |

          git config user.name "quantum-bot"

          git config user.email "quantum-bot@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || \
            git commit -m "Update walk-forward results"

          git push
