name: Quantum Bot Research

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 0"

jobs:

  research:

    runs-on: ubuntu-latest

    steps:

      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install "freqtrade[hyperopt]"

          freqtrade --version

      - name: Create directories
        run: |

          mkdir -p data
          mkdir -p data/backtests
          mkdir -p user_data
          mkdir -p user_data/strategies
          mkdir -p user_data/configs
          mkdir -p user_data/data

          cp QuantumMomentumStrategy.py \
             user_data/strategies/

          cp config.json \
             user_data/configs/

           - name: Calculate dates
        shell: bash
        run: |

          python - <<'PY'

          from datetime import (
              datetime,
              timedelta,
              timezone
          )

          today = datetime.now(
              timezone.utc
          ).date()

          test_end = today

          test_start = (
              test_end -
              timedelta(days=30)
          )

          train_start = (
              test_start -
              timedelta(days=90)
          )

          train_start = train_start.strftime("%Y%m%d")
          test_start = test_start.strftime("%Y%m%d")
          test_end = test_end.strftime("%Y%m%d")

          print("TRAIN_START:", train_start)
          print("TEST_START :", test_start)
          print("TEST_END   :", test_end)

          with open(
              "dates.env",
              "w"
          ) as f:

              f.write(
                  f"TRAIN_START={train_start}\n"
              )

              f.write(
                  f"TEST_START={test_start}\n"
              )

              f.write(
                  f"TEST_END={test_end}\n"
              )

          PY

          cat dates.env

          cat dates.env >> "$GITHUB_ENV"
