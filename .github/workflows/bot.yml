name: Kripto Bot 7/24

on:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir çalıştırır
  workflow_dispatch: # Manuel olarak da çalıştırabilirsin

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          FREQTRADE__TELEGRAM__TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FREQTRADE__TELEGRAM__CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Eğer user_data klasörü yoksa sıfırdan oluştur
          if [ ! -d "user_data" ]; then
            freqtrade create-userdir --userdir user_data
          fi

          # Gerekli klasörleri oluştur
          mkdir -p user_data/strategies user_data/configs

          # Strateji ve config dosyalarını kopyala
          cp QuantumMomentumStrategy.py user_data/strategies/
          cp config.json user_data/configs/

          # Freqtrade botunu başlat
          freqtrade trade \
            --strategy QuantumMomentumStrategy \
            --config user_data/configs/config.json \
            --userdir user_data
