name: Quantum Bot Research

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 0"

jobs:

  research:

    runs-on: ubuntu-latest

    steps:

      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install "freqtrade[hyperopt]"

          python -c "import filelock; print('filelock OK')"

          freqtrade --version

      - name: Create directories
        run: |

          mkdir -p data

          mkdir -p user_data/strategies

          mkdir -p user_data/configs

          mkdir -p user_data/data

          mkdir -p data/backtests

          cp QuantumMomentumStrategy.py \
             user_data/strategies/

          cp config.json \
             user_data/configs/

      - name: Calculate dates
        id: dates
        run: |

          python - <<'PY'

          from datetime import datetime, timedelta, timezone

          today = datetime.now(
              timezone.utc
          ).date()

          test_end = today

          test_start = (
              test_end -
              timedelta(days=30)
          )

          train_start = (
              test_start -
              timedelta(days=90)
          )

          print(
              "TRAIN_START=" +
              train_start.strftime("%Y%m%d")
          )

          print(
              "TEST_START=" +
              test_start.strftime("%Y%m%d")
          )

          print(
              "TEST_END=" +
              test_end.strftime("%Y%m%d")
          )

          with open(
              "dates.env",
              "w"
          ) as f:

              f.write(
                  "TRAIN_START=" +
                  train_start.strftime("%Y%m%d") +
                  "\n"
              )

              f.write(
                  "TEST_START=" +
                  test_start.strftime("%Y%m%d") +
                  "\n"
              )

              f.write(
                  "TEST_END=" +
                  test_end.strftime("%Y%m%d") +
                  "\n"
              )

          PY

          cat dates.env

      - name: Scan
        run: |

          python scanner.py

      - name: Download futures data
        run: |

          source dates.env

          freqtrade download-data \
            --config config.json \
            --trading-mode futures \
            --timeframes 15m \
            --timerange "${TRAIN_START}-${TEST_END}" \
            --pairs \
              ETH/USDT:USDT \
              BTC/USDT:USDT \
              SOL/USDT:USDT \
              XRP/USDT:USDT \
              BTW/USDT:USDT

      - name: Optimize
        run: |

          source dates.env

          python optimizer.py \
            --timerange "${TRAIN_START}-${TEST_START}"

      - name: Walk Forward Test
        run: |

          python walk_forward.py

      - name: Lookahead check
        run: |

          source dates.env

          freqtrade lookahead-analysis \
            --config config.json \
            --strategy QuantumMomentumStrategy \
            --timerange "${TEST_START}-${TEST_END}" \
            --pairs BTC/USDT:USDT \
            --minimum-trade-amount 10 || true

      - name: Save results
        run: |

          git config user.name "quantum-bot"

          git config user.email \
            "quantum-bot@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || \
            git commit \
            -m "Update walk-forward results"

          git push
