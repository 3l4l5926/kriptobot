name: Quantum Bot Research

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 0"

jobs:

  research:

    runs-on: ubuntu-latest

    steps:

      - name: Repository
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install "freqtrade[hyperopt]"

          python -c "import filelock; print('filelock OK')"

          freqtrade --version

      - name: Create directories
        run: |

          mkdir -p data
          mkdir -p user_data
          mkdir -p user_data/strategies
          mkdir -p user_data/configs
          mkdir -p user_data/data
          mkdir -p user_data/backtest_results

          cp QuantumMomentumStrategy.py \
             user_data/strategies/

          cp config.json \
             user_data/configs/

      - name: Calculate dates
        shell: bash
        run: |

          python - <<'PY'

          from datetime import (
              datetime,
              timedelta,
              timezone
          )

          today = datetime.now(
              timezone.utc
          ).date()

          test_end = today

          test_start = (
              test_end -
              timedelta(days=30)
          )

          train_start = (
              test_start -
              timedelta(days=90)
          )

          train_start = train_start.strftime(
              "%Y%m%d"
          )

          test_start = test_start.strftime(
              "%Y%m%d"
          )

          test_end = test_end.strftime(
              "%Y%m%d"
          )

          print(
              "TRAIN_START:",
              train_start
          )

          print(
              "TEST_START:",
              test_start
          )

          print(
              "TEST_END:",
              test_end
          )

          with open(
              "dates.env",
              "w"
          ) as f:

              f.write(
                  f"TRAIN_START={train_start}\n"
              )

              f.write(
                  f"TEST_START={test_start}\n"
              )

              f.write(
                  f"TEST_END={test_end}\n"
              )

          PY

          cat dates.env

          cat dates.env >> "$GITHUB_ENV"

      - name: Scan
        run: |

          python scanner.py

      - name: Check candidate pairs
        shell: bash
        run: |

          python - <<'PY'

          import json
          import sys

          with open(
              "data/candidate_pairs.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          pairs = data.get(
              "pairs",
              []
          )

          print(
              "Candidate pairs:",
              len(pairs)
          )

          for pair in pairs:
              print(pair)

          if not pairs:
              sys.exit(
                  "candidate_pairs.json boş!"
              )

          PY

      - name: Download futures data
        shell: bash
        run: |

          python - <<'PY'

          import json
          import os
          import subprocess

          from datetime import (
              datetime,
              timedelta
          )

          with open(
              "data/candidate_pairs.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          pairs = data.get(
              "pairs",
              []
          )

          train_start = datetime.strptime(
              os.environ["TRAIN_START"],
              "%Y%m%d"
          )

          test_end = datetime.strptime(
              os.environ["TEST_END"],
              "%Y%m%d"
          )

          current = train_start

          while current < test_end:

              next_date = (
                  current +
                  timedelta(days=30)
              )

              if next_date > test_end:
                  next_date = test_end

              timerange = (
                  current.strftime("%Y%m%d")
                  +
                  "-"
                  +
                  next_date.strftime("%Y%m%d")
              )

              print(
                  "DOWNLOADING:",
                  timerange
              )

              command = [
                  "freqtrade",
                  "download-data",
                  "--config",
                  "config.json",
                  "--trading-mode",
                  "futures",
                  "--timeframes",
                  "15m",
                  "--timerange",
                  timerange,
                  "--pairs"
              ]

              command.extend(pairs)

              result = subprocess.run(
                  command
              )

              if result.returncode != 0:
                  raise SystemExit(
                      "Data download failed."
                  )

              current = next_date

          PY

      - name: Verify data
        run: |

          echo "DATA:"
          find user_data/data \
            -type f \
            | head -100

      - name: Optimize
        shell: bash
        run: |

          echo "================================"
          echo "TRAIN"
          echo "${TRAIN_START}-${TEST_START}"
          echo "================================"

          python optimizer.py \
            --timerange \
            "${TRAIN_START}-${TEST_START}"

      - name: Walk Forward Test
        shell: bash
        run: |

          echo "================================"
          echo "WALK FORWARD"
          echo "TRAIN: ${TRAIN_START}-${TEST_START}"
          echo "TEST : ${TEST_START}-${TEST_END}"
          echo "================================"

          python walk_forward.py

      - name: Analyze backtest signals
        shell: bash
        run: |

          echo "================================"
          echo "BACKTEST SIGNAL ANALYSIS"
          echo "================================"

          freqtrade backtesting-analysis \
            --config config.json \
            --backtest-directory user_data/backtest_results \
            --analysis-groups 0 1 2 3 \
            --rejected-signals \
            --indicator-list \
            rsi \
            adx \
            macd \
            macdsignal \
            || true

      - name: Show pair parameters
        run: |

          echo "=============================="
          echo "PAIR PARAMS"
          echo "=============================="

          cat data/pair_params.json || true

      - name: Show walk forward results
        run: |

          echo "=============================="
          echo "WALK FORWARD RESULTS"
          echo "=============================="

          cat data/walk_forward_results.json || true

      - name: Show active pairs
        run: |

          echo "=============================="
          echo "ACTIVE PAIRS"
          echo "=============================="

          cat data/active_pairs.json || true

      - name: Save results
        shell: bash
        run: |

          git config user.name \
            "quantum-bot"

          git config user.email \
            "quantum-bot@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || \
            git commit \
            -m "Update walk-forward results"

          git push
