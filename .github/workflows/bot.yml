name: Quantum Bot Research

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 0"

jobs:

  research:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # REPOSITORY
      # =====================================================

      - name: Repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # =====================================================
      # INSTALL
      # =====================================================

      - name: Install
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install "freqtrade[hyperopt]"

          python -c "import filelock; print('filelock OK')"

          freqtrade --version

      # =====================================================
      # DIRECTORIES
      # =====================================================

      - name: Create directories
        run: |

          mkdir -p data
          mkdir -p data/backtests

          mkdir -p user_data
          mkdir -p user_data/strategies
          mkdir -p user_data/configs
          mkdir -p user_data/data

          cp QuantumMomentumStrategy.py \
             user_data/strategies/

          cp config.json \
             user_data/configs/

      # =====================================================
      # CALCULATE DATES
      #
      # TEST  = son 30 gün
      # TRAIN = testten önceki 90 gün
      #
      # Örneğin bugün 2026-08-19 ise:
      #
      # TRAIN = 20260421-20260720
      # TEST  = 20260720-20260819
      # =====================================================

      - name: Calculate dates
        shell: bash
        run: |

          python - <<'PY'

          from datetime import (
              datetime,
              timedelta,
              timezone
          )

          today = datetime.now(
              timezone.utc
          ).date()

          test_end = today

          test_start = (
              test_end -
              timedelta(days=30)
          )

          train_start = (
              test_start -
              timedelta(days=90)
          )

          train_start = train_start.strftime(
              "%Y%m%d"
          )

          test_start = test_start.strftime(
              "%Y%m%d"
          )

          test_end = test_end.strftime(
              "%Y%m%d"
          )

          print(
              "TRAIN_START:",
              train_start
          )

          print(
              "TEST_START:",
              test_start
          )

          print(
              "TEST_END:",
              test_end
          )

          with open(
              "dates.env",
              "w"
          ) as f:

              f.write(
                  f"TRAIN_START={train_start}\n"
              )

              f.write(
                  f"TEST_START={test_start}\n"
              )

              f.write(
                  f"TEST_END={test_end}\n"
              )

          PY

          cat dates.env

          cat dates.env >> "$GITHUB_ENV"

      # =====================================================
      # SCAN
      # =====================================================

      - name: Scan
        run: |

          python scanner.py

      # =====================================================
      # CHECK CANDIDATE PAIRS
      # =====================================================

      - name: Check candidate pairs
        shell: bash
        run: |

          python - <<'PY'

          import json
          import sys

          path = "data/candidate_pairs.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          pairs = data.get(
              "pairs",
              []
          )

          print(
              "Candidate pairs:",
              len(pairs)
          )

          for pair in pairs:
              print(pair)

          if not pairs:

              print(
                  "ERROR: candidate_pairs.json boş!"
              )

              sys.exit(1)

          PY

      # =====================================================
      # DOWNLOAD FUTURES DATA
      #
      # Gate 15m uzun tarih aralığında problem çıkardığı
      # için 30 günlük parçalar halinde indiriyoruz.
      #
      # Toplam:
      #
      # 90 gün TRAIN
      # +
      # 30 gün TEST
      # =
      # 120 gün veri
      # =====================================================

      - name: Download futures data
        shell: bash
        run: |

          python - <<'PY'

          import json
          import subprocess

          from datetime import (
              datetime,
              timedelta
          )


          # -----------------------------------------------
          # Candidate coinleri oku
          # -----------------------------------------------

          with open(
              "data/candidate_pairs.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          pairs = data.get(
              "pairs",
              []
          )


          if not pairs:

              raise SystemExit(
                  "candidate_pairs.json boş!"
              )


          # -----------------------------------------------
          # Tarihler GitHub ENV'den geliyor
          # -----------------------------------------------

          import os


          train_start = datetime.strptime(
              os.environ["TRAIN_START"],
              "%Y%m%d"
          )


          test_end = datetime.strptime(
              os.environ["TEST_END"],
              "%Y%m%d"
          )


          # -----------------------------------------------
          # 30 günlük parçalar
          # -----------------------------------------------

          current = train_start


          while current < test_end:

              next_date = (
                  current +
                  timedelta(days=30)
              )


              if next_date > test_end:

                  next_date = test_end


              timerange = (
                  current.strftime("%Y%m%d")
                  +
                  "-"
                  +
                  next_date.strftime("%Y%m%d")
              )


              print("")
              print("=" * 70)
              print(
                  "DOWNLOADING:",
                  timerange
              )
              print(
                  "PAIR COUNT:",
                  len(pairs)
              )
              print("=" * 70)


              command = [

                  "freqtrade",

                  "download-data",

                  "--config",
                  "config.json",

                  "--trading-mode",
                  "futures",

                  "--timeframes",
                  "15m",

                  "--timerange",
                  timerange,

                  "--pairs"

              ]


              command.extend(
                  pairs
              )


              result = subprocess.run(
                  command
              )


              if result.returncode != 0:

                  raise SystemExit(
                      "Futures data download failed."
                  )


              current = next_date


          PY

      # =====================================================
      # VERIFY DOWNLOADED DATA
      # =====================================================

      - name: Verify downloaded data
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "DOWNLOADED DATA"
          echo "=========================================="

          find user_data/data \
            -type f \
            | head -100

      # =====================================================
      # OPTIMIZE
      #
      # SADECE TRAIN DÖNEMİ
      #
      # TEST VERİSİ BURADA KULLANILMAZ.
      # =====================================================

      - name: Optimize
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "HYPEROPT"
          echo "=========================================="

          echo "TRAIN:"
          echo "${TRAIN_START}-${TEST_START}"

          python optimizer.py \
            --timerange \
            "${TRAIN_START}-${TEST_START}"

      # =====================================================
      # WALK FORWARD TEST
      #
      # TRAIN PARAMETRELERİ
      # SONRAKİ 30 GÜNDE TEST EDİLİR.
      # =====================================================

      - name: Walk Forward Test
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "WALK FORWARD"
          echo "=========================================="

          echo "TRAIN:"
          echo "${TRAIN_START}-${TEST_START}"

          echo "TEST:"
          echo "${TEST_START}-${TEST_END}"

          python walk_forward.py

      # =====================================================
      # LOOKAHEAD ANALYSIS
      # =====================================================

      - name: Lookahead check
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "LOOKAHEAD ANALYSIS"
          echo "=========================================="

          freqtrade lookahead-analysis \
            --config config.json \
            --strategy QuantumMomentumStrategy \
            --timerange \
            "${TEST_START}-${TEST_END}" \
            --pairs BTC/USDT:USDT \
            --minimum-trade-amount 10 \
            || true

      # =====================================================
      # SHOW PAIR PARAMETERS
      # =====================================================

      - name: Show pair parameters
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "PAIR PARAMETERS"
          echo "=========================================="

          if [ -f data/pair_params.json ]; then

              cat data/pair_params.json

          else

              echo "pair_params.json bulunamadı."

          fi

      # =====================================================
      # SHOW WALK FORWARD RESULTS
      # =====================================================

      - name: Show walk forward results
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "WALK FORWARD RESULTS"
          echo "=========================================="

          if [ -f data/walk_forward_results.json ]; then

              cat data/walk_forward_results.json

          else

              echo "walk_forward_results.json bulunamadı."

          fi

      # =====================================================
      # SHOW ACTIVE PAIRS
      # =====================================================

      - name: Show active pairs
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "ACTIVE PAIRS"
          echo "=========================================="

          if [ -f data/active_pairs.json ]; then

              cat data/active_pairs.json

          else

              echo "active_pairs.json bulunamadı."

          fi

      # =====================================================
      # SAVE RESULTS TO GITHUB
      # =====================================================

      - name: Save results
        shell: bash
        run: |

          git config user.name \
            "quantum-bot"

          git config user.email \
            "quantum-bot@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || \
            git commit \
            -m "Update walk-forward results"

          git push
